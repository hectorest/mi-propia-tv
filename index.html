<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi TV">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Mi propia TV</title>
<style>
  :root {
    --bg:#0f1115; --card:#181b22; --card2:#1f2330; --line:#2a2f3a; --text:#e8eaf0; --muted:#9aa3b2;
    --acc:#4f8cff; --star:#f5c542; --err:#ff6b6b;
    --top: env(safe-area-inset-top); --bot: env(safe-area-inset-bottom);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  [hidden] { display:none !important; }
  button { font:inherit; color:inherit; }
  input, select { font-size:16px; }

  /* Login */
  #login { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; padding-top:calc(24px + var(--top)); }
  #login form { width:100%; max-width:400px; }
  #login img { width:72px; height:72px; border-radius:18px; display:block; margin:0 auto 12px; }
  #login h1 { text-align:center; margin:0 0 4px; font-size:24px; }
  #login p { text-align:center; color:var(--muted); margin:0 0 20px; font-size:14px; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  .field { width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:#0c0e12; color:var(--text); }
  .btn { display:block; width:100%; padding:13px; border-radius:10px; border:1px solid var(--line); background:var(--card2); font-weight:600; cursor:pointer; text-align:center; text-decoration:none; color:var(--text); }
  .btn.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
  .btn.danger { color:var(--err); }
  .btn + .btn { margin-top:10px; }
  .err { color:var(--err); font-size:14px; min-height:20px; margin-top:10px; text-align:center; }
  .note { color:var(--muted); font-size:12.5px; margin-top:14px; text-align:center; }

  /* App */
  header { position:sticky; top:0; z-index:5; background:rgba(15,17,21,.92); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    padding:calc(10px + var(--top)) 12px 10px; display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #back { background:none; border:0; color:var(--acc); font-size:16px; padding:4px 6px; cursor:pointer; }
  main { padding:8px 12px calc(84px + var(--bot)); }
  nav.tabs { position:fixed; left:0; right:0; bottom:0; z-index:5; display:flex; background:rgba(24,27,34,.96); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-top:1px solid var(--line); padding-bottom:var(--bot); }
  nav.tabs button { flex:1; background:none; border:0; padding:8px 0 10px; color:var(--muted); font-size:11px; cursor:pointer; }
  nav.tabs button .i { display:block; font-size:21px; line-height:1.2; }
  nav.tabs button.on { color:var(--acc); }

  .search { position:sticky; top:calc(52px + var(--top)); z-index:4; background:var(--bg); padding:6px 0 8px; }
  h3 { font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin:16px 4px 6px; font-weight:600; }
  ul.list { list-style:none; margin:0; padding:0; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  ul.list li { display:flex; align-items:center; gap:10px; padding:9px 8px 9px 10px; border-top:1px solid var(--line); min-height:56px; }
  ul.list li:first-child { border-top:0; }
  .tap { flex:1; display:flex; align-items:center; gap:10px; min-width:0; background:none; border:0; text-align:left; padding:0; cursor:pointer; }
  .logo { width:40px; height:40px; flex:none; border-radius:8px; background:var(--card2); display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; color:var(--muted); overflow:hidden; }
  .logo img { width:100%; height:100%; object-fit:contain; }
  .name { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sub { display:block; color:var(--muted); font-size:12.5px; }
  .ico { background:none; border:0; font-size:20px; width:40px; height:40px; border-radius:8px; color:var(--muted); cursor:pointer; flex:none; }
  .ico.star.on { color:var(--star); }
  .chev { color:var(--muted); padding-right:6px; }
  .empty { color:var(--muted); text-align:center; padding:28px 16px; font-size:14px; }
  .tip { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; color:var(--muted); font-size:13.5px; margin-top:10px; }
  .tip b { color:var(--text); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-top:10px; }
  .kv { display:flex; justify-content:space-between; gap:12px; padding:6px 0; font-size:14px; border-top:1px solid var(--line); }
  .kv:first-child { border-top:0; }
  .kv span:first-child { color:var(--muted); }
  .spinner { text-align:center; color:var(--muted); padding:24px; font-size:14px; }

  /* Hoja inferior */
  #sheet { position:fixed; inset:0; z-index:20; }
  #sheet .bg { position:absolute; inset:0; background:rgba(0,0,0,.55); }
  #sheet .panel { position:absolute; left:0; right:0; bottom:0; background:var(--card); border-radius:16px 16px 0 0; border-top:1px solid var(--line);
    padding:16px 16px calc(16px + var(--bot)); max-height:85vh; overflow:auto; }
  #sheet h2 { margin:0 0 4px; font-size:18px; }
  .epg { margin:12px 0 14px; }
  .epg div { padding:7px 0; border-top:1px solid var(--line); font-size:14px; }
  .epg div:first-child { border-top:0; }
  .epg .t { color:var(--muted); font-variant-numeric:tabular-nums; margin-right:8px; }
  .epg .now { color:var(--acc); font-weight:600; }

  #toast { position:fixed; left:50%; bottom:calc(96px + var(--bot)); transform:translateX(-50%); background:#2b3140; color:var(--text);
    padding:10px 16px; border-radius:20px; font-size:14px; z-index:30; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90vw; text-align:center; }
  #toast.on { opacity:1; }
</style>
</head>
<body>

<!-- Inicio de sesión -->
<section id="login" hidden>
  <form id="loginForm" autocomplete="off">
    <img src="icon-192.png" alt="">
    <h1>Mi propia TV</h1>
    <p>Tus datos se guardan solo en este dispositivo.</p>
    <label for="lServer">Servidor</label>
    <input id="lServer" class="field" type="url" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="https://mi-servidor.com" required>
    <label for="lUser">Usuario</label>
    <input id="lUser" class="field" autocapitalize="off" spellcheck="false" required>
    <label for="lPass">Contraseña</label>
    <input id="lPass" class="field" type="password" required>
    <div class="err" id="lErr"></div>
    <button class="btn primary" id="lBtn" type="submit">Entrar</button>
    <div class="note">Usa la dirección <b>https://</b> de la API. Los canales se abrirán en el reproductor de Safari, desde donde puedes enviarlos a la tele por AirPlay.</div>
  </form>
</section>

<!-- App -->
<section id="app" hidden>
  <header>
    <button id="back" hidden>‹ Atrás</button>
    <h1 id="title">Mi TV</h1>
  </header>
  <main id="content"></main>
  <nav class="tabs">
    <button data-tab="favs"><span class="i">★</span>Favoritos</button>
    <button data-tab="cats"><span class="i">☰</span>Categorías</button>
    <button data-tab="search"><span class="i">⌕</span>Buscar</button>
    <button data-tab="settings"><span class="i">⚙︎</span>Ajustes</button>
  </nav>
</section>

<div id="sheet" hidden><div class="bg"></div><div class="panel" id="sheetPanel"></div></div>
<div id="toast"></div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);

  // ---------- almacenamiento local ----------
  const store = {
    get(k, def) { try { const v = localStorage.getItem('mitv.' + k); return v ? JSON.parse(v) : def; } catch (_) { return def; } },
    set(k, v) { try { localStorage.setItem('mitv.' + k, JSON.stringify(v)); } catch (_) {} },
    del(k) { try { localStorage.removeItem('mitv.' + k); } catch (_) {} },
  };

  const DEFAULTS = { mode: 'scriptable', fmt: 'm3u8', proto: 'http', streamBase: '', scriptName: 'MiTV' };
  const S = {
    cfg: Object.assign({}, DEFAULTS, store.get('cfg', {})),
    info: store.get('info', null),
    favs: store.get('favs', []),
    recent: store.get('recent', []),
    cats: null,
    byCat: {},
    all: null,
    ch: new Map(),
    tab: 'favs',
    cat: null,
    catFilter: '',
    query: '',
  };
  for (const c of S.favs.concat(S.recent)) S.ch.set(String(c.stream_id), c);

  // Migración: las configuraciones anteriores a Scriptable pasan a usarlo, y se descarta una dirección
  // por IP aplicada desde la prueba (con Cloudflare delante, esa IP no es la del servidor real).
  (() => {
    const saved = store.get('cfg', null);
    if (!saved || saved.scriptName) return;
    S.cfg.mode = 'scriptable';
    S.cfg.scriptName = 'MiTV';
    if (S.cfg.tpl && /^https?:\/\/[\d.]+[:/]/.test(S.cfg.tpl.prefix)) delete S.cfg.tpl;
    store.set('cfg', S.cfg);
  })();

  // ---------- utilidades ----------
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const norm = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const initials = (s) => String(s || '?').replace(/[^\p{L}\p{N} ]/gu, ' ').trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase() || '?';
  const b64 = (s) => { try { return new TextDecoder().decode(Uint8Array.from(atob(s), (c) => c.charCodeAt(0))); } catch (_) { return s || ''; } };
  const hhmm = (ts) => new Date(Number(ts) * 1000).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

  let toastT;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600);
  }

  function normBase(s) {
    s = String(s || '').trim().replace(/\/+$/, '');
    if (s && !/^https?:\/\//i.test(s)) s = 'https://' + s;
    return s;
  }

  // ---------- API Xtream ----------
  async function api(params = {}, cfg = S.cfg, ms = 20000) {
    const url = new URL(cfg.server + '/player_api.php');
    url.searchParams.set('username', cfg.user);
    url.searchParams.set('password', cfg.pass);
    for (const [k, v] of Object.entries(params)) url.searchParams.set(k, v);
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), ms);
    try {
      const res = await fetch(url, { cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer', signal: c.signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } catch (e) {
      if (e.name === 'AbortError') throw new Error('El servidor no responde');
      throw e;
    } finally { clearTimeout(t); }
  }

  const slim = (s) => ({ stream_id: s.stream_id, name: s.name, stream_icon: s.stream_icon || '', category_id: s.category_id, num: s.num });
  function remember(list) { for (const s of list) S.ch.set(String(s.stream_id), s); return list; }

  async function getCats() {
    if (!S.cats) S.cats = await api({ action: 'get_live_categories' });
    return S.cats;
  }
  async function getStreams(catId) {
    if (!S.byCat[catId]) S.byCat[catId] = remember((await api({ action: 'get_live_streams', category_id: catId })).map(slim));
    return S.byCat[catId];
  }
  async function getAll() {
    if (!S.all) S.all = remember((await api({ action: 'get_live_streams' }, S.cfg, 60000)).map(slim));
    return S.all;
  }

  // ---------- URL del stream y reproducción ----------
  function streamBase() {
    if (S.cfg.streamBase) {
      const b = S.cfg.streamBase.trim().replace(/\/+$/, '');
      return /^https?:\/\//i.test(b) ? b : 'http://' + b;
    }
    const si = (S.info && S.info.server_info) || {};
    const api = new URL(S.cfg.server);
    if (S.cfg.proto === 'https') return api.origin;
    const host = (si.url || api.hostname).replace(/^https?:\/\//, '').replace(/[:/].*$/, '');
    const port = String(si.port || '80');
    return `http://${host}${port && port !== '80' && port !== '0' ? ':' + port : ''}`;
  }
  function streamUrl(id) {
    const t = S.cfg.tpl;
    if (t) return t.prefix + id + (t.ext ? '.' + S.cfg.fmt : '') + (t.query || '');
    return `${streamBase()}/live/${encodeURIComponent(S.cfg.user)}/${encodeURIComponent(S.cfg.pass)}/${id}.${S.cfg.fmt}`;
  }

  // Oculta usuario y contraseña (y opcionalmente el dominio) para mostrar o compartir URLs.
  function mask(s, hideHost) {
    s = String(s);
    const reps = [S.cfg.pass, encodeURIComponent(S.cfg.pass), S.cfg.user, encodeURIComponent(S.cfg.user)];
    for (const x of reps) if (x && x.length >= 2) s = s.split(x).join('***');
    if (hideHost) s = s.replace(/^(https?:\/\/)([^/:?#]+)/i, (_, p, h) => p + (/^[\d.]+$/.test(h) ? 'IP' : 'DOMINIO'));
    return s;
  }

  // Lee la lista M3U oficial del proveedor y devuelve el primer canal en directo, tal como lo genera el panel.
  async function detectFromM3U() {
    const url = new URL(S.cfg.server + '/get.php');
    url.searchParams.set('username', S.cfg.user);
    url.searchParams.set('password', S.cfg.pass);
    url.searchParams.set('type', 'm3u_plus');
    url.searchParams.set('output', 'm3u8');
    const c = new AbortController();
    const timer = setTimeout(() => c.abort(), 45000);
    let res;
    try {
      res = await fetch(url, { cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer', signal: c.signal });
    } catch (e) {
      clearTimeout(timer);
      throw new Error(e.name === 'AbortError' ? 'El servidor tarda demasiado en dar la lista.' : 'El servidor no deja leer la lista M3U desde la web (CORS) o no responde.');
    }
    if (!res.ok) { clearTimeout(timer); throw new Error('El servidor respondió HTTP ' + res.status + ' al pedir la lista M3U.'); }

    const find = (text) => {
      const lines = text.split(/\r?\n/);
      for (let i = 0; i < lines.length - 1; i++) {
        if (!lines[i].startsWith('#EXTINF')) continue;
        let j = i + 1;
        while (j < lines.length && (lines[j].trim() === '' || lines[j].startsWith('#'))) j++;
        const u = (lines[j] || '').trim();
        if (/^https?:\/\//i.test(u) && !/\/(movie|series)\//i.test(u) && j < lines.length - 1) {
          const name = (lines[i].split(',').pop() || '').trim();
          return { url: u, name };
        }
      }
      return null;
    };

    try {
      if (res.body && res.body.getReader) {
        const reader = res.body.getReader();
        const dec = new TextDecoder();
        let buf = '';
        for (;;) {
          const { done, value } = await reader.read();
          if (value) buf += dec.decode(value, { stream: true });
          const hit = find(buf);
          if (hit) { reader.cancel().catch(() => {}); return hit; }
          if (done || buf.length > 8e6) break;
        }
        const hit = find(buf + '\n#');
        if (hit) return hit;
      } else {
        const hit = find(await res.text() + '\n#');
        if (hit) return hit;
      }
    } finally { clearTimeout(timer); }
    throw new Error('La lista M3U no contiene canales en directo reconocibles.');
  }

  // Resuelve el dominio a IPv4 con DNS sobre HTTPS (Google y Cloudflare permiten CORS).
  async function resolveIPv4(host) {
    if (/^[\d.]+$/.test(host)) return host;
    const tries = [
      () => fetch(`https://dns.google/resolve?name=${encodeURIComponent(host)}&type=A`, { cache: 'no-store' }),
      () => fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(host)}&type=A`, { cache: 'no-store', headers: { accept: 'application/dns-json' } }),
    ];
    for (const t of tries) {
      try {
        const j = await (await t()).json();
        const a = (j.Answer || []).find((x) => x.type === 1);
        if (a) return a.data;
      } catch (_) {}
    }
    return null;
  }

  function parseTpl(u) {
    const m = u.match(/^(.*\/)(\d+)(\.[a-z0-9]+)?(\?.*)?$/i);
    return m ? { prefix: m[1], ext: (m[3] || '').slice(1), query: m[4] || '', sampleId: m[2] } : null;
  }
  const vlcUrl = (url) => 'vlc-x-callback://x-callback-url/stream?url=' + encodeURIComponent(url);
  const scriptableUrl = (url) => `scriptable:///run/${encodeURIComponent(S.cfg.scriptName || 'MiTV')}?url=${encodeURIComponent(url)}`;

  function addRecent(ch) {
    S.recent = [slim(ch)].concat(S.recent.filter((c) => String(c.stream_id) !== String(ch.stream_id))).slice(0, 12);
    store.set('recent', S.recent);
  }

  // Debe ejecutarse de forma síncrona dentro del toque, o Safari bloquea la ventana.
  function play(ch, mode = S.cfg.mode) {
    const url = streamUrl(ch.stream_id);
    addRecent(ch);
    if (mode === 'scriptable') { location.href = scriptableUrl(url); return; }
    if (mode === 'vlc') { location.href = vlcUrl(url); return; }
    if (mode === 'same') { location.href = url; return; }
    const w = window.open(url, '_blank');
    if (w) { try { w.opener = null; } catch (_) {} }
    else location.href = url;
  }

  function isFav(id) { return S.favs.some((c) => String(c.stream_id) === String(id)); }
  function toggleFav(ch) {
    if (isFav(ch.stream_id)) { S.favs = S.favs.filter((c) => String(c.stream_id) !== String(ch.stream_id)); toast('Quitado de favoritos'); }
    else { S.favs.push(slim(ch)); toast('Añadido a favoritos'); }
    store.set('favs', S.favs);
  }

  // ---------- render ----------
  function logoHtml(ch) {
    const ini = esc(initials(ch.name));
    const src = ch.stream_icon && /^https?:\/\//.test(ch.stream_icon) ? ch.stream_icon.replace(/^http:\/\//, 'https://') : '';
    return `<span class="logo">${src ? `<img src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer" data-ini="${ini}">` : ini}</span>`;
  }

  function channelList(list, { showNum = true } = {}) {
    if (!list.length) return '';
    return '<ul class="list">' + list.map((ch) => `
      <li>
        <button class="tap" data-act="play" data-id="${esc(ch.stream_id)}">
          ${logoHtml(ch)}
          <span class="name">${esc(ch.name)}${showNum && ch.num ? `<span class="sub">${esc(ch.num)}</span>` : ''}</span>
        </button>
        <button class="ico star ${isFav(ch.stream_id) ? 'on' : ''}" data-act="fav" data-id="${esc(ch.stream_id)}" aria-label="Favorito">${isFav(ch.stream_id) ? '★' : '☆'}</button>
        <button class="ico" data-act="more" data-id="${esc(ch.stream_id)}" aria-label="Más">⋯</button>
      </li>`).join('') + '</ul>';
  }

  function fixLogos(root) {
    root.querySelectorAll('.logo img').forEach((img) => {
      img.onerror = () => { const p = img.parentNode; if (p) p.textContent = img.dataset.ini || '?'; };
    });
  }

  function setHeader(title, back) {
    $('title').textContent = title;
    $('back').hidden = !back;
  }

  function render() {
    document.querySelectorAll('nav.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === S.tab));
    const c = $('content');
    ({ favs: renderFavs, cats: renderCats, search: renderSearch, settings: renderSettings })[S.tab](c);
    fixLogos(c);
  }

  function renderFavs(c) {
    setHeader('Favoritos', false);
    let html = '';
    if (S.favs.length) html += channelList(S.favs, { showNum: false });
    else html += `<div class="empty">Aún no tienes favoritos.<br>Pulsa ☆ en cualquier canal para añadirlo aquí.</div>`;
    if (S.recent.length) html += '<h3>Vistos recientemente</h3>' + channelList(S.recent, { showNum: false });
    html += S.cfg.mode === 'scriptable'
      ? `<div class="tip"><b>Cómo verlo en la tele:</b> toca un canal; Scriptable se abrirá un instante y el canal aparecerá en Safari. Allí pulsa el icono de AirPlay (▭ con triángulo) y elige tu tele. ¿Primera vez? Configura Scriptable en Ajustes.</div>`
      : `<div class="tip"><b>Cómo verlo en la tele:</b> toca un canal y se abrirá en el reproductor de Safari. Allí pulsa el icono de AirPlay (▭ con triángulo) y elige tu tele.</div>`;
    if (!navigator.standalone) html += `<div class="tip"><b>Instálala:</b> en Safari pulsa Compartir → «Añadir a pantalla de inicio» para tenerla como una app.</div>`;
    c.innerHTML = html;
  }

  async function renderCats(c) {
    if (S.cat) return renderCat(c);
    setHeader('Categorías', false);
    if (!S.cats) {
      c.innerHTML = '<div class="spinner">Cargando categorías…</div>';
      try { await getCats(); } catch (e) { c.innerHTML = `<div class="empty">No se pudieron cargar las categorías.<br>${esc(e.message)}</div>`; return; }
      if (S.tab !== 'cats' || S.cat) return;
    }
    c.innerHTML = `<div class="search"><input class="field" id="catFilter" type="search" placeholder="Filtrar ${S.cats.length} categorías" value="${esc(S.catFilter)}"></div><div id="catList"></div>`;
    const draw = () => {
      const q = norm(S.catFilter);
      const list = S.cats.filter((k) => !q || norm(k.category_name).includes(q));
      $('catList').innerHTML = list.length
        ? '<ul class="list">' + list.map((k) => `<li><button class="tap" data-act="cat" data-id="${esc(k.category_id)}"><span class="name">${esc(k.category_name)}</span><span class="chev">›</span></button></li>`).join('') + '</ul>'
        : '<div class="empty">Ninguna categoría coincide.</div>';
    };
    $('catFilter').oninput = (e) => { S.catFilter = e.target.value; draw(); };
    draw();
  }

  async function renderCat(c) {
    const cat = (S.cats || []).find((k) => String(k.category_id) === String(S.cat));
    setHeader(cat ? cat.category_name : 'Canales', true);
    if (!S.byCat[S.cat]) {
      c.innerHTML = '<div class="spinner">Cargando canales…</div>';
      try { await getStreams(S.cat); } catch (e) { c.innerHTML = `<div class="empty">No se pudieron cargar los canales.<br>${esc(e.message)}</div>`; return; }
      if (S.tab !== 'cats' || !S.cat) return;
    }
    const list = S.byCat[S.cat];
    c.innerHTML = list.length ? channelList(list) : '<div class="empty">Esta categoría está vacía.</div>';
    fixLogos(c);
    window.scrollTo(0, 0);
  }

  let searchT;
  function renderSearch(c) {
    setHeader('Buscar', false);
    c.innerHTML = `<div class="search"><input class="field" id="q" type="search" placeholder="Nombre del canal" value="${esc(S.query)}" autocapitalize="off" autocorrect="off" spellcheck="false"></div><div id="results"></div>`;
    const q = $('q');
    q.oninput = () => { S.query = q.value; clearTimeout(searchT); searchT = setTimeout(doSearch, 250); };
    if (!S.query) setTimeout(() => q.focus(), 50);
    doSearch();
  }
  async function doSearch() {
    const out = $('results');
    if (!out) return;
    const q = norm(S.query).trim();
    if (q.length < 2) { out.innerHTML = '<div class="empty">Escribe al menos 2 letras.</div>'; return; }
    if (!S.all) {
      out.innerHTML = '<div class="spinner">Cargando todos los canales (solo la primera vez)…</div>';
      try { await getAll(); } catch (e) { out.innerHTML = `<div class="empty">No se pudo cargar la lista completa.<br>${esc(e.message)}</div>`; return; }
      if (!$('results')) return;
    }
    const words = q.split(/\s+/);
    const hits = S.all.filter((ch) => { const n = norm(ch.name); return words.every((w) => n.includes(w)); });
    const shown = hits.slice(0, 200);
    $('results').innerHTML = shown.length
      ? channelList(shown) + (hits.length > 200 ? `<div class="empty">Mostrando 200 de ${hits.length}. Afina la búsqueda.</div>` : '')
      : '<div class="empty">Sin resultados.</div>';
    fixLogos($('results'));
  }

  function renderSettings(c) {
    setHeader('Ajustes', false);
    const ui = (S.info && S.info.user_info) || {};
    const exp = ui.exp_date ? new Date(Number(ui.exp_date) * 1000).toLocaleDateString('es-ES') : '—';
    let host = '';
    try { host = new URL(S.cfg.server).host; } catch (_) {}
    c.innerHTML = `
      <h3>Cuenta</h3>
      <div class="card">
        <div class="kv"><span>Servidor</span><span>${esc(host)}</span></div>
        <div class="kv"><span>Usuario</span><span>${esc(S.cfg.user)}</span></div>
        <div class="kv"><span>Estado</span><span>${esc(ui.status || '—')}</span></div>
        <div class="kv"><span>Caduca</span><span>${esc(exp)}</span></div>
        <div class="kv"><span>Conexiones</span><span>${esc(ui.active_cons ?? '—')} / ${esc(ui.max_connections ?? '—')}</span></div>
      </div>

      <h3>Reproducción</h3>
      <div class="card">
        <label for="sMode">Abrir los canales en</label>
        <select id="sMode" class="field">
          <option value="scriptable">Scriptable → Safari (recomendado)</option>
          <option value="tab">Safari (nueva pestaña)</option>
          <option value="same">Safari (misma pestaña)</option>
          <option value="vlc">App VLC</option>
        </select>
        <label for="sFmt">Formato</label>
        <select id="sFmt" class="field">
          <option value="m3u8">HLS (.m3u8) — necesario para Safari y AirPlay</option>
          <option value="ts">MPEG-TS (.ts) — solo con VLC</option>
        </select>
        <label for="sProto">Protocolo de los streams</label>
        <select id="sProto" class="field">
          <option value="http">HTTP (servidor original)</option>
          <option value="https">HTTPS (misma dirección que la API)</option>
        </select>
        <label for="sBase">Dirección de streams (avanzado, vacío = automática)</label>
        <input id="sBase" class="field" type="url" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="${esc(S.cfg.streamBase ? '' : streamBase())}" value="${esc(S.cfg.streamBase)}">
        <div class="note" style="text-align:left">Ejemplo de URL generada: <span id="sExample" style="word-break:break-all">${esc(mask(streamUrl('ID')))}</span></div>
      </div>

      <h3>Scriptable</h3>
      <div class="card">
        <div class="note" style="text-align:left;margin:0 0 10px">Tu proveedor solo entrega el vídeo a reproductores, no a navegadores. Scriptable pide el canal como reproductor desde tu iPhone y abre en Safari la dirección final, ya lista para AirPlay.</div>
        <ol class="note" style="text-align:left;padding-left:18px;margin:0 0 12px">
          <li>Instala <b>Scriptable</b> (gratis) desde la App Store.</li>
          <li>Pulsa «Copiar script» aquí abajo.</li>
          <li>En Scriptable, pulsa <b>+</b>, pega el código y pon como nombre exactamente <b>${esc(S.cfg.scriptName || 'MiTV')}</b>.</li>
          <li>La primera vez que toques un canal, iOS te pedirá permiso para abrir Scriptable.</li>
        </ol>
        <button class="btn primary" id="sCopyScript" disabled>Cargando script…</button>
        <label for="sScriptName">Nombre del script en Scriptable</label>
        <input id="sScriptName" class="field" autocapitalize="off" spellcheck="false" value="${esc(S.cfg.scriptName || 'MiTV')}">
      </div>

      <h3>Dirección de los streams</h3>
      <div class="card">
        ${S.cfg.tpl
          ? `<div class="note" style="text-align:left;margin:0 0 10px">✅ Usando la dirección detectada en la lista M3U de tu proveedor.</div>
             <button class="btn" id="sTplOff">Volver a la dirección automática</button>`
          : ''}
        <button class="btn primary" id="sDetect">Detectar desde la lista M3U del proveedor</button>
        <div id="detectOut"></div>
      </div>

      <h3>Datos</h3>
      <div class="card">
        <button class="btn" id="sReload">Recargar listas de canales</button>
        <a class="btn" href="diagnostico.html">Abrir página de diagnóstico</a>
        <button class="btn danger" id="sLogout">Cerrar sesión y borrar datos</button>
      </div>
      <div class="note">Usuario, contraseña y favoritos se guardan solo en este dispositivo.</div>`;
    $('sMode').value = S.cfg.mode;
    $('sFmt').value = S.cfg.fmt;
    $('sProto').value = S.cfg.proto;
    const save = () => {
      S.cfg.mode = $('sMode').value;
      S.cfg.fmt = $('sFmt').value;
      S.cfg.proto = $('sProto').value;
      S.cfg.streamBase = $('sBase').value.trim().replace(/\/+$/, '');
      store.set('cfg', S.cfg);
      if (S.cfg.fmt === 'ts' && S.cfg.mode !== 'vlc') toast('Safari no reproduce .ts: usa VLC o vuelve a HLS');
      renderSettings(c);
    };
    $('sMode').onchange = save; $('sFmt').onchange = save; $('sProto').onchange = save; $('sBase').onchange = save;
    $('sScriptName').onchange = () => {
      S.cfg.scriptName = $('sScriptName').value.trim() || 'MiTV';
      store.set('cfg', S.cfg);
      renderSettings(c);
    };
    // Se descarga antes del toque para poder copiarlo al portapapeles dentro del gesto (Safari lo exige).
    fetch('scriptable/MiTV.js', { cache: 'no-store' })
      .then((r) => (r.ok ? r.text() : Promise.reject()))
      .then((code) => {
        const b = $('sCopyScript');
        if (!b) return;
        b.disabled = false; b.textContent = 'Copiar script';
        b.onclick = () => {
          navigator.clipboard.writeText(code)
            .then(() => toast('Script copiado. Pégalo en Scriptable'))
            .catch(() => prompt('Copia el script:', code));
        };
      })
      .catch(() => { const b = $('sCopyScript'); if (b) b.textContent = 'No se pudo cargar el script'; });
    if ($('sTplOff')) $('sTplOff').onclick = () => { delete S.cfg.tpl; store.set('cfg', S.cfg); toast('Dirección automática'); renderSettings(c); };
    $('sDetect').onclick = async () => {
      const out = $('detectOut');
      const btn = $('sDetect');
      btn.disabled = true; btn.textContent = 'Descargando lista M3U…';
      out.innerHTML = '';
      try {
        const hit = await detectFromM3U();
        S.detected = hit;
        const u = new URL(hit.url);
        const api = new URL(S.cfg.server);
        const tpl = parseTpl(hit.url);
        const current = mask(streamUrl(tpl ? tpl.sampleId : 'ID'));
        const same = tpl && streamUrl(tpl.sampleId) === hit.url;
        const ip = u.protocol === 'http:' ? await resolveIPv4(u.hostname) : null;
        const ipUrl = ip && ip !== u.hostname ? hit.url.replace(u.hostname, ip) : null;
        out.innerHTML = `
          <div class="kv"><span>Canal</span><span>${esc(hit.name || '—')}</span></div>
          <div class="kv"><span>Protocolo</span><span>${esc(u.protocol.replace(':', '').toUpperCase())}</span></div>
          <div class="kv"><span>Dominio</span><span>${u.hostname === api.hostname ? 'el mismo que la API' : 'distinto al de la API'}</span></div>
          <div class="kv"><span>Puerto</span><span>${esc(u.port || (u.protocol === 'https:' ? '443' : '80'))}</span></div>
          <div class="note" style="text-align:left">Dirección del proveedor:<br><span style="word-break:break-all;color:var(--text)">${esc(mask(hit.url))}</span></div>
          <div class="note" style="text-align:left">Dirección que monta la app ahora:<br><span style="word-break:break-all">${esc(current)}</span><br>${same ? '✅ Coinciden.' : '⚠️ No coinciden.'}</div>
          <div style="margin-top:12px">
            <button class="btn primary" id="dPlay">▶ Probar este canal en Safari</button>
            <button class="btn" id="dVlc">Probar en VLC</button>
            ${tpl && !same ? '<button class="btn" id="dUse">Usar la dirección del proveedor</button>' : ''}
          </div>
          ${ipUrl ? `
          <h3 style="margin-left:0">Prueba por IP</h3>
          <div class="note" style="text-align:left;margin-top:0">Safari puede cambiar <b>http</b> por <b>https</b> en un dominio, pero nunca en una IP. Si por IP se reproduce y por dominio da 403, el culpable es ese cambio automático.</div>
          <div class="note" style="text-align:left">IP del servidor: <span style="color:var(--text)">${esc(ip)}</span></div>
          <div style="margin-top:10px">
            <button class="btn primary" id="dIpPlay">▶ Probar por IP en Safari</button>
            <button class="btn" id="dIpUse">Usar la IP para todos los canales</button>
          </div>` : (u.protocol === 'http:' && !/^[\d.]+$/.test(u.hostname) ? '<div class="note" style="text-align:left">No se pudo averiguar la IP del servidor.</div>' : '')}
          <div style="margin-top:10px"><button class="btn" id="dCopy">Copiar resultado para compartir</button></div>`;
        if ($('dIpPlay')) {
          $('dIpPlay').onclick = () => { const w = window.open(ipUrl, '_blank'); if (!w) location.href = ipUrl; };
          $('dIpUse').onclick = () => {
            const t = parseTpl(ipUrl);
            if (!t) return;
            S.cfg.tpl = { prefix: t.prefix, ext: t.ext, query: t.query };
            if (t.ext === 'm3u8' || t.ext === 'ts') S.cfg.fmt = t.ext;
            store.set('cfg', S.cfg);
            toast('Los canales usarán la IP');
            renderSettings(c);
          };
        }
        $('dPlay').onclick = () => { const w = window.open(hit.url, '_blank'); if (!w) location.href = hit.url; };
        $('dVlc').onclick = () => { location.href = vlcUrl(hit.url); };
        if ($('dUse')) $('dUse').onclick = () => {
          S.cfg.tpl = { prefix: tpl.prefix, ext: tpl.ext, query: tpl.query };
          if (tpl.ext === 'm3u8' || tpl.ext === 'ts') S.cfg.fmt = tpl.ext;
          store.set('cfg', S.cfg);
          toast('Dirección del proveedor aplicada');
          renderSettings(c);
        };
        $('dCopy').onclick = async () => {
          const txt = `Proveedor: ${mask(hit.url, true)}\nApp: ${mask(streamUrl(tpl ? tpl.sampleId : 'ID'), true)}\nNavegador: ${navigator.userAgent}`;
          try { await navigator.clipboard.writeText(txt); toast('Copiado sin credenciales ni dominio'); }
          catch (_) { prompt('Copia el texto:', txt); }
        };
      } catch (e) {
        const manual = new URL(S.cfg.server + '/get.php');
        manual.searchParams.set('username', S.cfg.user); manual.searchParams.set('password', S.cfg.pass);
        manual.searchParams.set('type', 'm3u_plus'); manual.searchParams.set('output', 'm3u8');
        out.innerHTML = `<div class="err" style="text-align:left">${esc(e.message)}</div>
          <a class="btn" href="${esc(manual.toString())}" target="_blank" rel="noopener">Abrir la lista M3U en otra pestaña</a>
          <div class="note" style="text-align:left">Ahí busca la primera línea que empiece por http debajo de un #EXTINF.</div>`;
      } finally {
        btn.disabled = false; btn.textContent = 'Detectar desde la lista M3U del proveedor';
      }
    };
    $('sReload').onclick = () => { S.cats = null; S.byCat = {}; S.all = null; refreshInfo(); toast('Las listas se recargarán al abrirlas'); };
    $('sLogout').onclick = () => {
      if (!confirm('¿Cerrar sesión? Se borrarán credenciales, favoritos y recientes de este dispositivo.')) return;
      ['cfg', 'info', 'favs', 'recent'].forEach(store.del);
      location.reload();
    };
  }

  // ---------- hoja de detalles ----------
  async function openSheet(ch) {
    const p = $('sheetPanel');
    p.innerHTML = `
      <h2>${esc(ch.name)}</h2>
      <div class="epg" id="epg"><div class="spinner" style="padding:8px">Cargando guía…</div></div>
      <button class="btn primary" data-sheet="scriptable">▶ Ver (Scriptable → Safari)</button>
      <button class="btn" data-sheet="tab">Abrir directamente en Safari</button>
      <button class="btn" data-sheet="vlc">Abrir en VLC</button>
      <button class="btn" data-sheet="copy">Copiar URL del stream</button>
      <button class="btn" data-sheet="fav">${isFav(ch.stream_id) ? '★ Quitar de favoritos' : '☆ Añadir a favoritos'}</button>
      <button class="btn" data-sheet="close">Cerrar</button>`;
    p.dataset.id = ch.stream_id;
    $('sheet').hidden = false;
    try {
      const r = await api({ action: 'get_short_epg', stream_id: ch.stream_id, limit: 4 });
      const items = (r && r.epg_listings) || [];
      const now = Date.now() / 1000;
      if ($('sheetPanel').dataset.id !== String(ch.stream_id)) return;
      $('epg').innerHTML = items.length
        ? items.map((it) => {
            const st = Number(it.start_timestamp), en = Number(it.stop_timestamp);
            const live = st <= now && now < en;
            return `<div class="${live ? 'now' : ''}"><span class="t">${st ? hhmm(st) : ''}</span>${esc(b64(it.title))}${live ? ' · ahora' : ''}</div>`;
          }).join('')
        : '<div style="color:var(--muted)">Sin guía para este canal.</div>';
    } catch (_) {
      if ($('epg')) $('epg').innerHTML = '<div style="color:var(--muted)">No se pudo cargar la guía.</div>';
    }
  }
  function closeSheet() { $('sheet').hidden = true; $('sheetPanel').dataset.id = ''; }

  $('sheet').addEventListener('click', async (e) => {
    if (e.target.classList.contains('bg')) return closeSheet();
    const b = e.target.closest('[data-sheet]');
    if (!b) return;
    const ch = S.ch.get(String($('sheetPanel').dataset.id));
    if (!ch) return closeSheet();
    const act = b.dataset.sheet;
    if (act === 'close') return closeSheet();
    if (act === 'scriptable') { play(ch, 'scriptable'); return closeSheet(); }
    if (act === 'tab') { play(ch, 'tab'); return closeSheet(); }
    if (act === 'vlc') { play(ch, 'vlc'); return closeSheet(); }
    if (act === 'fav') { toggleFav(ch); closeSheet(); return render(); }
    if (act === 'copy') {
      const url = streamUrl(ch.stream_id);
      try { await navigator.clipboard.writeText(url); toast('URL copiada'); }
      catch (_) { prompt('Copia la URL:', url); }
    }
  });

  // ---------- eventos de la lista ----------
  $('content').addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const id = String(b.dataset.id);
    const act = b.dataset.act;
    if (act === 'cat') { S.cat = id; return render(); }
    const ch = S.ch.get(id);
    if (!ch) return;
    if (act === 'play') return play(ch);
    if (act === 'more') return openSheet(ch);
    if (act === 'fav') {
      toggleFav(ch);
      const on = isFav(id);
      document.querySelectorAll(`[data-act="fav"][data-id="${CSS.escape(id)}"]`).forEach((x) => { x.classList.toggle('on', on); x.textContent = on ? '★' : '☆'; });
      if (S.tab === 'favs') render();
    }
  });

  document.querySelectorAll('nav.tabs button').forEach((b) => {
    b.onclick = () => {
      if (S.tab === b.dataset.tab && b.dataset.tab === 'cats') S.cat = null;
      S.tab = b.dataset.tab;
      render();
      window.scrollTo(0, 0);
    };
  });
  $('back').onclick = () => { S.cat = null; render(); };

  // ---------- sesión ----------
  async function refreshInfo() {
    try {
      const r = await api();
      if (r && r.user_info) { S.info = r; store.set('info', r); }
    } catch (_) {}
  }

  $('loginForm').onsubmit = async (e) => {
    e.preventDefault();
    const cfg = Object.assign({}, S.cfg, { server: normBase($('lServer').value), user: $('lUser').value.trim(), pass: $('lPass').value.trim() });
    $('lErr').textContent = '';
    if (cfg.server.startsWith('http://')) { $('lErr').textContent = 'Usa la dirección https:// (desde esta web no se puede llamar a http://).'; return; }
    $('lBtn').disabled = true; $('lBtn').textContent = 'Comprobando…';
    try {
      const r = await api({}, cfg);
      if (!r || !r.user_info || String(r.user_info.auth) !== '1') throw new Error('Usuario o contraseña incorrectos');
      if (r.user_info.status && r.user_info.status !== 'Active') throw new Error('Cuenta no activa: ' + r.user_info.status);
      S.cfg = cfg; S.info = r;
      store.set('cfg', cfg); store.set('info', r);
      showApp();
    } catch (err) {
      $('lErr').textContent = err.message === 'Failed to fetch' || err.message === 'Load failed' ? 'No se pudo conectar con el servidor.' : err.message;
    } finally {
      $('lBtn').disabled = false; $('lBtn').textContent = 'Entrar';
    }
  };

  function showApp() {
    $('login').hidden = true;
    $('app').hidden = false;
    render();
  }

  if (S.cfg.server && S.cfg.user && S.cfg.pass) { showApp(); refreshInfo(); }
  else $('login').hidden = false;

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
})();
</script>
</body>
</html>
